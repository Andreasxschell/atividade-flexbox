<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Questão 24 – Faixa de cards</title>
  <link rel="stylesheet" href="questao24.css">
</head>
<body>
  <div class="faixa">
    <div class="card">
      <h2>Card 1</h2>
      <p>Texto curto.</p>
    </div>
    <div class="card">
      <h2>Card 2</h2>
      <p>Um texto bem mais longo, para mostrar que todos os cards da
         mesma linha ficam com a mesma altura visual.</p>
    </div>
    <div class="card">
      <h2>Card 3</h2>
      <p>Texto médio, com algumas palavras a mais.</p>
    </div>
    <div class="card">
      <h2>Card 4</h2>
      <p>Outro texto curto.</p>
    </div>
  </div>
</body>
</html>
